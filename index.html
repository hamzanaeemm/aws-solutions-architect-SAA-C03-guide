<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Required</title>
<style>
:root{ --bg:#030805; --ink:#b8ffcc; --accent:#00ff66; --muted:#3f8a57; --err:#ff5f56; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); overflow:hidden}
canvas{position:fixed; inset:0; width:100%; height:100%}
.vignette{position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(3,8,5,.55) 0%, rgba(3,8,5,.25) 45%, rgba(3,8,5,.9) 100%); pointer-events:none}
form{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px}
input{width:min(340px, 100%); padding:14px 16px; background:rgba(0,12,4,.85); border:1px solid var(--accent); border-radius:6px;
  color:var(--ink); font:16px/1 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing:.15em; text-align:center;
  box-shadow:0 0 18px rgba(0,255,102,.35), inset 0 0 12px rgba(0,255,102,.08); outline:none; caret-color:var(--accent)}
input::placeholder{color:var(--muted); letter-spacing:.1em}
input:focus{box-shadow:0 0 28px rgba(0,255,102,.6), inset 0 0 12px rgba(0,255,102,.12)}
.err{min-height:1.2em; color:var(--err); font:13px ui-monospace, Menlo, Consolas, monospace; text-shadow:0 0 8px rgba(255,95,86,.6)}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="vignette"></div>
<form id="loginForm">
  <input type="password" name="password" placeholder="ENTER PASSWORD" aria-label="Password" autocomplete="current-password" autofocus required>
  <div class="err" id="err"></div>
</form>
<script>
const msg = { wrong: "ACCESS DENIED", locked: "TOO MANY ATTEMPTS — TRY AGAIN LATER" }[new URLSearchParams(location.search).get("e")];
if (msg) document.getElementById("err").textContent = msg;

const c = document.getElementById("rain"), ctx = c.getContext("2d");
const chars = "アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF<>/{}[]$#";
const size = 16;
let drops = [];
function resize(){
  c.width = innerWidth; c.height = innerHeight;
  drops = Array.from({ length: Math.ceil(c.width / size) }, () => Math.random() * -c.height / size);
}
resize(); addEventListener("resize", resize);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(){
  ctx.fillStyle = "rgba(3,8,5,.08)"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.font = size + "px monospace";
  drops.forEach((y, i) => {
    ctx.fillStyle = Math.random() < .03 ? "#d6ffe2" : "#00e05a";
    ctx.fillText(chars[Math.random() * chars.length | 0], i * size, y * size);
    drops[i] = y * size > c.height && Math.random() > .975 ? 0 : y + 1;
  });
}
if (still) { for (let i = 0; i < 60; i++) frame(); } else window.rainTimer = setInterval(frame, 50);
</script>

const KEY = "saa-site-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c));
  /* document.open() is ignored while this page is still parsing, and write() would then merge the guide into it */
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
  clearInterval(window.rainTimer);
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.s), iterations: P.n }, base, 256));
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) { try { await open(b64(saved)); return; } catch(e){ try { localStorage.removeItem(KEY); } catch(e2){} } }
})();
const form = document.getElementById("loginForm"), input = form.querySelector("input"), err = document.getElementById("err");
form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "DECRYPTING…"; input.disabled = true;
  try {
    const raw = await derive(input.value);
    await open(raw);
    try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch(e){}
  } catch(e2){
    err.textContent = "ACCESS DENIED"; input.disabled = false; input.value = ""; input.focus();
  }
});
</script>
